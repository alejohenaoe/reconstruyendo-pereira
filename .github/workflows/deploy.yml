name: Deploy a Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://rpbpwwwvakpxzdinvojw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8jIT-FghNnGgitI6r8lgiw_z0xJCE_d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Desplegar en Netlify
        run: npx netlify-cli@latest deploy --dir dist --prod --site "$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
